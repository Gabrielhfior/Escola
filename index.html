<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermercado</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <img src="assets/logo-removebg-preview.png" alt="Logo">

        <nav>

            <a href="#dias">Semanal</a>
            <a href="#descontos">Descontos</a>
            <a href="#contato">Contato</a>
        </nav>
        
    </header> 

    

    <section id="dias"> 
        <div class="segunda">
            <h2>Segunda da limpeza</h2>
        </div>

        <div class="terca">
            <h2>Terça da Panificadora</h2>
        </div>

        <div class="quarta">
            <h2>Quarta Verde</h2>
        </div>

        <div class="quinta">
            <h2>Quinta da carne</h2>
        </div>

        <div class="fds">
            <h2>Final de semana</h2>
        </div>
    </section>

    <section id="encarte">
        <h1>
            Encarte Diário
        </h1>
        <img src="assets/encarte.jpeg" alt="encarte-diario">

    <footer>
        <h3>Supermercado Aura</h3>
        <p>Criado por Gabriel, Anelize, Daniel e Reginaldo</p>
    </footer>
